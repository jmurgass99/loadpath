[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loadpath"
version = "0.1.1"
description = "Structural data contract in strict Pydantic v2: materials, frame sections and internal forces with SI units in every field name, extra=forbid and JSON Schema for TypeScript; plus 2D beam FEA helpers for non-prismatic members (EI(x), EA(x) by Simpson) and semi-rigid end springs (Monforton-Wu)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jesús Murgas" }]
keywords = ["structural-engineering", "data-contract", "schemas", "pydantic", "json-schema", "sections", "materials", "internal-forces", "frame-sections", "finite-element", "beam-stiffness", "non-prismatic", "semi-rigid-connections", "eurocode", "sap2000"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["pydantic>=2", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-timeout>=2.2"]

[project.urls]
Homepage = "https://github.com/jmurgass99/loadpath"
Repository = "https://github.com/jmurgass99/loadpath"
Issues = "https://github.com/jmurgass99/loadpath/issues"

[tool.setuptools.packages.find]
include = ["loadpath*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
