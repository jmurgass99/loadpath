[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loadpath"
version = "0.1.0"
description = "Unified structural data schemas (materials, frame sections, internal forces) as strict Pydantic v2 models, plus small FEA helpers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jesús Murgas" }]
keywords = ["structural-engineering", "schemas", "pydantic", "data-model", "sections", "materials", "internal-forces"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["pydantic>=2", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-timeout>=2.2"]

[project.urls]
Homepage = "https://github.com/jmurgass99/loadpath"
Repository = "https://github.com/jmurgass99/loadpath"
Issues = "https://github.com/jmurgass99/loadpath/issues"

[tool.setuptools.packages.find]
include = ["loadpath*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
